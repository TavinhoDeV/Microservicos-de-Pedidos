services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"      # painel: http://localhost:15672 (guest/guest)

  pedidos-db:
    image: postgres:16
    environment: { POSTGRES_DB: pedidos, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5433:5432"]

  estoque-db:
    image: postgres:16
    environment: { POSTGRES_DB: estoque, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5434:5432"]
